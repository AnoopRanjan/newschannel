services:
  - type: web
    name: bharatstream-platform
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: ENABLE_BACKGROUND_VERIFIER
        value: "true"
      - key: VERIFIER_INTERVAL_HOURS
        value: "4"
