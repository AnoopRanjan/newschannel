version: '3.8'

services:
  web:
    build: .
    container_name: bharatstream_app
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bharatstream_db
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=bharatstream@admin2026
      - ADMIN_API_KEY=bs-admin-sec-key-998877
      - ENABLE_BACKGROUND_VERIFIER=true
      - VERIFIER_INTERVAL_HOURS=4
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: bharatstream_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=bharatstream_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
